name: Bug report
description: Something in payflow-docs does not work as documented.
labels: ["bug", "docs"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private vulnerability
        reporting instead (see SECURITY.md), not a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Where
      options:
        - protocol
        - guides
        - reference
        - developers
        - not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The page and the passage that is wrong or unclear, and what it should say.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or deployment
      description: The commit hash, release, or contract ids you were using.
